# BrainAPI deploy profile: light
# Slim stack (Redis + Postgres/pgvector + API/worker/MCP).
# Pair with deploy/env.light.example → /root/.env
# See deploy/README.md

version: "3.8"

services:
  nginx:
    image: nginx:stable-alpine
    container_name: brainapi-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /srv/nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - /srv/nginx/conf/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /srv/nginx/logs:/var/log/nginx
    networks:
      - appnet
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
    mem_limit: 16m
    cpus: 0.025

  redis:
    image: redis:7-alpine
    container_name: brainapi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 192mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-backlog 511
      --timeout 300
    networks:
      - appnet
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.0625
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    container_name: brainapi-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - appnet
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  brainapi:
    image: ghcr.io/lumen-labs/brainapi:v2.9.7-dev
    container_name: brainapi-api
    ports:
      - "8000:8000"
    env_file:
      - /root/.env
    environment:
      PLUGIN_REGISTRY_URL: ${PLUGIN_REGISTRY_URL:-}
      PLUGIN_PUBLISHER_ID: ${PLUGIN_PUBLISHER_ID:-}
      PLUGIN_PUBLISHER_API_KEY: ${PLUGIN_PUBLISHER_API_KEY:-}
      BRAINAPI_PLUGINS: ${BRAINAPI_PLUGINS:-}
    volumes:
      - brainapi-plugins:/app/plugins
    command:
      [
        "-m",
        "uvicorn",
        "src.services.api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "1",
        "--timeout-keep-alive",
        "30",
        "--limit-concurrency",
        "50",
        "--backlog",
        "256",
      ]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - appnet
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.25
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/",
          "-H",
          "BrainPAT: ${BRAINPAT_TOKEN}",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
      start_interval: 30s

  brainapi-worker:
    image: ghcr.io/lumen-labs/brainapi:v2.9.7-dev
    container_name: brainapi-worker
    env_file:
      - /root/.env
    environment:
      BRAINAPI_PLUGINS: ${BRAINAPI_PLUGINS:-}
      PLUGIN_REGISTRY_URL: ${PLUGIN_REGISTRY_URL:-}
      PLUGIN_PUBLISHER_ID: ${PLUGIN_PUBLISHER_ID:-}
      PLUGIN_PUBLISHER_API_KEY: ${PLUGIN_PUBLISHER_API_KEY:-}
    volumes:
      - brainapi-plugins:/app/plugins
    command:
      [
        "-m",
        "celery",
        "-A",
        "src.workers.app",
        "worker",
        "--loglevel=info",
        "--pool=threads",
        "--without-gossip",
        "--without-mingle",
        "--concurrency=1",
        "--max-tasks-per-child=50",
      ]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - appnet
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.25
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -m celery -A src.workers.app inspect ping --timeout 5 >/dev/null 2>&1 && q=$(redis-cli -h redis -p 6379 LLEN ingest_data 2>/dev/null || echo 0); [ \"$q\" -lt \"${CELERY_QUEUE_HEALTH_THRESHOLD:-50}\" ]",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
      start_interval: 30s

  brainapi-mcp:
    image: ghcr.io/lumen-labs/brainapi:v2.9.7-dev
    container_name: brainapi-mcp
    ports:
      - "8001:8001"
    env_file:
      - /root/.env
    environment:
      MCP_OAUTH_ISSUER_URL: ${MCP_OAUTH_ISSUER_URL:-}
      MCP_RESOURCE_SERVER_URL: ${MCP_RESOURCE_SERVER_URL:-}
      BRAINAPI_PLUGINS: ${BRAINAPI_PLUGINS:-}
      PLUGIN_REGISTRY_URL: ${PLUGIN_REGISTRY_URL:-}
      PLUGIN_PUBLISHER_ID: ${PLUGIN_PUBLISHER_ID:-}
      PLUGIN_PUBLISHER_API_KEY: ${PLUGIN_PUBLISHER_API_KEY:-}
    volumes:
      - brainapi-plugins:/app/plugins
    command:
      [
        "-m",
        "uvicorn",
        "src.services.mcp.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--timeout-keep-alive",
        "30",
      ]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - appnet
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.25
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'code=$(curl -s -o /dev/null -w ''%{http_code}'' http://localhost:8001/); test "$code" = ''200'' || test "$code" = ''405''',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  appnet:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  brainapi-plugins:
