map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream brainapi_api {
    server brainapi:8000;
    keepalive 16;
}

upstream brainapi_mcp {
    server brainapi-mcp:8001;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /health {
        proxy_pass http://brainapi_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location /mcp {
        proxy_pass http://brainapi_mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://brainapi_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Safe default until an operator mounts a certificate-specific TLS server file.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
